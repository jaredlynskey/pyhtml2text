# Originally generated by `maturin generate-ci github` (v1.15.0), then extended
# with profile-guided optimisation (PGO) builds for the targets that GitHub can
# run natively: see .github/actions/pgo-profile and pgo/.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            pgo: true
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-24.04-arm
            target: aarch64
            pgo: true
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PGO profile
        if: ${{ matrix.platform.pgo }}
        uses: ./.github/actions/pgo-profile
        with:
          target: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t python3.15t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ matrix.platform.target == 'x86_64' || matrix.platform.target == 'aarch64' }}
      - name: pytest
        if: ${{ matrix.platform.target == 'x86_64' || matrix.platform.target == 'aarch64' }}
        run: .github/pytest.sh 3.10 3.14t 3.15 3.15t
      - name: pytest
        if: ${{ contains(fromJSON('["armv7", "s390x", "ppc64le"]'), matrix.platform.target) }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv
          run: |
            set -e
            python3 -m venv .venv
            source .venv/bin/activate
            pip install pytest markdown-it-py html5lib
            pip install pyhtml2text --no-index --no-deps --find-links dist --force-reinstall
            pip install pyhtml2text
            pytest

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t python3.15t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        run: |
          set -e
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c '
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pyhtml2text --no-index --no-deps --find-links dist --force-reinstall
            pip install pyhtml2text pytest markdown-it-py html5lib
            pytest
          '
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pyhtml2text --no-index --no-deps --find-links dist --force-reinstall
            pip install pyhtml2text pytest markdown-it-py html5lib
            pytest

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            pgo: true
            pythons: 3.10 3.14t 3.15 3.15t
          - runner: windows-latest
            target: x86
            python_arch: x86
            pythons: >-
              cpython-3.10-windows-x86 cpython-3.14t-windows-x86
              cpython-3.15-windows-x86 cpython-3.15t-windows-x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            # There is no uv-managed Python 3.10 for arm64 Windows.
            pythons: 3.11 3.14t 3.15 3.15t
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: PGO profile
        if: ${{ matrix.platform.pgo }}
        uses: ./.github/actions/pgo-profile
        with:
          target: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          # sccache before 0.19 can't parse the `-Tp <path>` that cc 1.9 and
          # later pass cl.exe for mimalloc's C++ source (rust-lang/cc-rs#2063).
          sccache: false
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.14t
            3.15t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t python3.15t
          # sccache before 0.19 can't parse the `-Tp <path>` that cc 1.9 and
          # later pass cl.exe for mimalloc's C++ source (rust-lang/cc-rs#2063).
          sccache: false
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pytest
        shell: bash
        run: .github/pytest.sh ${{ matrix.platform.pythons }}

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            pgo: true
          - runner: macos-latest
            target: aarch64
            pgo: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PGO profile
        if: ${{ matrix.platform.pgo }}
        uses: ./.github/actions/pgo-profile
        with:
          target: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.14t
            3.15t
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t python3.15t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rust-toolchain: ${{ env.PGO_RUST_TOOLCHAIN }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pytest
        run: .github/pytest.sh 3.10 3.14t 3.15 3.15t

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/pyhtml2text
    permissions:
      # Trusted publishing to PyPI, and signing the attestations
      id-token: write
      contents: read
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.3.3
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # Trusted publishing (OIDC) - no token stored in the repo.
        run: uv publish --trusted-publishing always 'wheels-*/*'
