[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyhtml2text"
version = "0.3.1"
description = "Fast HTML to plain text, with relative link resolution (Python bindings to rust-html2text)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jared Lynskey", email = "jared@lynskey.co.nz" }]
keywords = ["html", "text", "markdown", "html2text"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Source = "https://github.com/jaredlynskey/pyhtml2text"
Upstream = "https://github.com/jugglerchris/rust-html2text"

[tool.maturin]
python-source = "python"
module-name = "pyhtml2text._pyhtml2text"
# cargo leaves out vendor/html5ever (it has its own Cargo.toml), but the
# [patch] in Cargo.toml needs it; the PGO data and CI files aren't needed.
include = [
  { path = "vendor/html5ever/Cargo.toml", format = "sdist" },
  { path = "vendor/html5ever/LICENSE-*", format = "sdist" },
  { path = "vendor/html5ever/README.md", format = "sdist" },
  { path = "vendor/html5ever/src/**/*.rs", format = "sdist" },
]
exclude = [
  { path = "pgo/**/*", format = "sdist" },
  { path = "bench/**/*", format = "sdist" },
  { path = ".github/**/*", format = "sdist" },
]

[tool.maturin.generate-ci.github]
pytest = true
