[package]
name = "pyhtml2text"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_pyhtml2text"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
# The HTML parser; patched below.
html5ever = "0.39"
# Display width of characters, for wrapping.
unicode-width = "=0.2.2"
# Reads the Markdown back to check that emphasis parses as intended.
pulldown-cmark = { version = "0.13", default-features = false }

# Much faster than the system allocators for the many small allocations of
# parsing and rendering.
# Not on glibc armv7/ppc64le/s390x: their manylinux2014 cross compilers are too
# old to build it (keep in sync with the cfg in src/lib.rs).
[target.'cfg(not(all(target_env = "gnu", any(target_arch = "arm", target_arch = "powerpc64", target_arch = "s390x"))))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[patch.crates-io]
# Fixes quadratic parsing of deeply nested HTML, see vendor/README.md.
html5ever = { path = "vendor/html5ever" }

[profile.release]
lto = true
codegen-units = 1
strip = true
