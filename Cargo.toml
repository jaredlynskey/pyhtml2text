[package]
name = "pyhtml2text"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_pyhtml2text"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py39"] }
# Fork of jugglerchris/rust-html2text with Config::base_url added.
html2text = { git = "https://github.com/jaredlynskey/rust-html2text", rev = "ee049006a900891e9df46299004c38ff59c41d65" }

[profile.release]
lto = true
codegen-units = 1
strip = true
