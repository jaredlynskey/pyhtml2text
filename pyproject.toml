[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "pyhtml2text"
version = "0.4.0"
description = "Fast HTML to plain text and Markdown, with relative link resolution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jared Lynskey", email = "jared@lynskey.co.nz" }]
keywords = ["html", "text", "markdown", "html2text"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/jaredlynskey/pyhtml2text"

[tool.maturin]
python-source = "python"
module-name = "pyhtml2text._pyhtml2text"
# cargo leaves out vendor/html5ever (it has its own Cargo.toml), but the
# [patch] in Cargo.toml needs it; the PGO data and CI files aren't needed.
include = [
  { path = "vendor/html5ever/Cargo.toml", format = "sdist" },
  { path = "vendor/html5ever/LICENSE-*", format = "sdist" },
  { path = "vendor/html5ever/README.md", format = "sdist" },
  { path = "vendor/html5ever/src/**/*.rs", format = "sdist" },
]
exclude = [
  { path = "pgo/**/*", format = "sdist" },
  { path = "bench/**/*", format = "sdist" },
  { path = ".github/**/*", format = "sdist" },
]

[tool.maturin.generate-ci.github]
pytest = true
