[package]
name = "pyhtml2text"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_pyhtml2text"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
# Fork of jugglerchris/rust-html2text with Config::base_url, some performance
# changes and the DOM exports the Markdown output uses (branch pyhtml2text-perf).
html2text = { git = "https://github.com/jaredlynskey/rust-html2text", rev = "b42930f8e6688ea121daf392e27a7d9812e6192d" }
# The parser html2text uses; patched below. Used directly to read element attributes.
html5ever = "0.39"
# Reads the Markdown back to check that emphasis parses as intended.
pulldown-cmark = { version = "0.13", default-features = false }

# Much faster than the system allocators for html2text's many small allocations.
# Not on glibc armv7/ppc64le/s390x: their manylinux2014 cross compilers are too
# old to build it (keep in sync with the cfg in src/lib.rs).
[target.'cfg(not(all(target_env = "gnu", any(target_arch = "arm", target_arch = "powerpc64", target_arch = "s390x"))))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[patch.crates-io]
# Fixes quadratic parsing of deeply nested HTML, see vendor/README.md.
html5ever = { path = "vendor/html5ever" }

[profile.release]
lto = true
codegen-units = 1
strip = true
